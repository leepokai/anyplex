# Publish to npm on a version tag, without a token: npm Trusted Publishing exchanges the
# workflow's GitHub OIDC identity for a short-lived credential and attaches provenance.
# One-time setup on npmjs.com: package anyplex -> Settings -> Trusted Publisher -> GitHub Actions
# (owner leepokai, repository anyplex, workflow publish.yml). Then: git tag v0.3.0 && git push --tags
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The tag must match package.json, so a stale tag never publishes the wrong version.
      - run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # prepublishOnly runs check, test (fakes only), and build.
      - run: npm publish --provenance --access public
